<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salary Counter</title>
  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --accent-color: #222222;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Huge display for the money */
    #counter {
      font-size: 12vw;
      font-weight: 700;
      letter-spacing: -2px;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
      font-variant-numeric: tabular-nums; /* Keeps numbers aligned */
    }

    #status-message {
      font-size: 1.5rem;
      color: #888;
      margin-top: 10px;
      font-weight: 300;
    }

    /* Top right settings button */
    #settings-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      background: none;
      border: none;
      color: #666;
      font-size: 2rem;
      cursor: pointer;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    #settings-btn:hover {
      color: var(--text-color);
      transform: rotate(45deg);
    }

    /* Settings Modal overlay */
    #settings-modal {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #111;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #333;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      border: 1px solid #444;
      color: var(--text-color);
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #888;
    }

    button.save-btn {
      width: 100%;
      padding: 14px;
      background: var(--text-color);
      color: var(--bg-color);
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button.save-btn:hover {
      background: #ccc;
    }
  </style>
</head>
<body>

  <button id="settings-btn" title="Settings">⚙</button>

  <div id="counter">₹0.00</div>
  <div id="status-message">Loading...</div>

  <div id="settings-modal">
    <div class="modal-content">
      <h2>Configuration</h2>
      <div class="form-group">
        <label>Monthly Salary (Post-Tax)</label>
        <input type="number" id="salary-input" placeholder="e.g. 100000" min="0">
      </div>
      <div class="form-group">
        <label>Work Start Time</label>
        <input type="time" id="start-time-input" value="10:00">
      </div>
      <div class="form-group">
        <label>Work End Time</label>
        <input type="time" id="end-time-input" value="18:00">
      </div>
      <button class="save-btn" id="save-btn">Start Counting</button>
    </div>
  </div>

  <script>
    // DOM Elements
    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status-message');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const saveBtn = document.getElementById('save-btn');
    const salaryInput = document.getElementById('salary-input');
    const startTimeInput = document.getElementById('start-time-input');
    const endTimeInput = document.getElementById('end-time-input');

    let intervalId = null;

    // Load saved configs from localStorage
    let config = {
      salary: parseFloat(localStorage.getItem('sc_salary')) || null,
      startTime: localStorage.getItem('sc_startTime') || '10:00',
      endTime: localStorage.getItem('sc_endTime') || '18:00'
    };

    // Initialize the app
    function init() {
      if (!config.salary) {
        settingsModal.style.display = 'flex';
        statusEl.innerText = "Awaiting configuration...";
      } else {
        salaryInput.value = config.salary;
        startTimeInput.value = config.startTime;
        endTimeInput.value = config.endTime;
        startCounter();
      }
    }

    // Settings logic
    settingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
    });

    saveBtn.addEventListener('click', () => {
      const newSalary = parseFloat(salaryInput.value);
      const newStart = startTimeInput.value;
      const newEnd = endTimeInput.value;

      if (!newSalary || !newStart || !newEnd) {
        alert("Please fill in all fields.");
        return;
      }

      config.salary = newSalary;
      config.startTime = newStart;
      config.endTime = newEnd;

      localStorage.setItem('sc_salary', newSalary);
      localStorage.setItem('sc_startTime', newStart);
      localStorage.setItem('sc_endTime', newEnd);

      settingsModal.style.display = 'none';
      startCounter();
    });

    // Helper: Calculate exact working days in the current month (Mon-Fri)
    function getWorkingDaysInMonth(year, month) {
      let days = 0;
      let date = new Date(year, month, 1);
      while (date.getMonth() === month) {
        // 0 is Sunday, 6 is Saturday
        if (date.getDay() !== 0 && date.getDay() !== 6) {
          days++;
        }
        date.setDate(date.getDate() + 1);
      }
      return days;
    }

    // Helper: Convert "HH:MM" string to a Date object for today
    function parseTime(timeStr) {
      const [hours, minutes] = timeStr.split(':').map(Number);
      const d = new Date();
      d.setHours(hours, minutes, 0, 0);
      return d;
    }

    // Format number to currency (Defaults to INR as requested by profile heuristics, but adaptable)
    function formatMoney(amount) {
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(amount);
    }

    // Core logic to update the counter
    function updateDisplay() {
      const now = new Date();
      
      // Check if it's a weekend
      const isWeekend = now.getDay() === 0 || now.getDay() === 6;
      if (isWeekend) {
        counterEl.innerText = formatMoney(0);
        statusEl.innerText = "It's the weekend. Enjoy your holiday!";
        return;
      }

      const workingDays = getWorkingDaysInMonth(now.getFullYear(), now.getMonth());
      const dailySalary = config.salary / workingDays;

      const start = parseTime(config.startTime);
      const end = parseTime(config.endTime);

      if (start >= end) {
        counterEl.innerText = "Error";
        statusEl.innerText = "Start time must be before end time.";
        return;
      }

      const totalWorkMilliseconds = end - start;
      const salaryPerMillisecond = dailySalary / totalWorkMilliseconds;

      if (now < start) {
        // Before work
        counterEl.innerText = formatMoney(0);
        statusEl.innerText = "Work hasn't started yet.";
      } else if (now > end) {
        // After work
        counterEl.innerText = formatMoney(dailySalary);
        statusEl.innerText = "Shift complete. Great job today!";
      } else {
        // During work hours - calculate exact earnings so far
        const elapsedMilliseconds = now - start;
        const earnedToday = elapsedMilliseconds * salaryPerMillisecond;
        counterEl.innerText = formatMoney(earnedToday);
        statusEl.innerText = "Earning in progress...";
      }
    }

    function startCounter() {
      if (intervalId) clearInterval(intervalId);
      updateDisplay(); // Run immediately so there's no 1-second delay
      // Set to refresh every 1000ms (1 second) as requested
      intervalId = setInterval(updateDisplay, 1000); 
    }

    // Boot up
    init();
  </script>
</body>
</html>
