<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Salary & Tax Counter</title>
  
  <!-- Dynamic Favicon Setup -->
  <link id="favicon" rel="icon" type="image/png" href="rupee.png">
  
  <!-- Load the external quote files -->
  <script src="quotes_earnings.js"></script>
  <script src="quotes_tax.js"></script>

  <style>
    :root {
      --bg-color: #000000;
      --text-color: #ffffff;
      --accent-color: #1a1a1a;
      --border-color: #333333;
      --highlight: #ffffff;
      --holiday-color: #ff4444;
      --weekend-color: #331111;
      --tax-bg-color: #4a0404; 
      --tax-accent: #6b0f0f;
    }

    body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; transition: background-color 0.5s ease; }
    body.tax-mode { background-color: var(--tax-bg-color); }

    /* Mode Toggle */
    .mode-toggle { display: flex; background: var(--accent-color); padding: 6px; border-radius: 40px; margin-bottom: 30px; border: 1px solid var(--border-color); transition: background 0.5s ease, border-color 0.5s ease; }
    body.tax-mode .mode-toggle { background: var(--tax-accent); border-color: #8a1c1c; }
    .mode-btn { background: transparent; border: none; color: #888; font-size: 1.1rem; font-weight: 600; padding: 12px 30px; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; }
    body.tax-mode .mode-btn { color: #ffaaaa; }
    .mode-btn.active { background: var(--highlight); color: var(--bg-color); box-shadow: 0 4px 15px rgba(255,255,255,0.2); }

    /* Counter Display */
    #counter { font-size: 10vw; font-weight: 700; letter-spacing: -2px; text-shadow: 0 0 40px rgba(255, 255, 255, 0.15); font-variant-numeric: tabular-nums; margin-bottom: 10px; text-align: center; width: 100%; box-sizing: border-box; padding: 0 20px; transition: color 0.5s ease; }
    #status-message { font-size: 1.2rem; color: #888; font-weight: 400; margin-bottom: 40px; height: 1.5rem; text-align: center; transition: color 0.5s ease; max-width: 80%; }
    body.tax-mode #status-message { color: #ffcccc; }

    /* Tabs & Tooltips */
    .tabs { display: flex; gap: 15px; background: var(--accent-color); padding: 8px; border-radius: 30px; border: 1px solid var(--border-color); transition: background 0.5s ease, border-color 0.5s ease; }
    body.tax-mode .tabs { background: var(--tax-accent); border-color: #8a1c1c; }
    .tab { position: relative; background: transparent; border: none; color: #888; font-size: 1rem; font-weight: 500; padding: 10px 24px; border-radius: 20px; cursor: pointer; transition: all 0.3s ease; }
    body.tax-mode .tab { color: #ffaaaa; }
    .tab.active { background: var(--highlight); color: var(--bg-color); box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    .tab:hover:not(.active) { color: var(--text-color); }
    .tab::after { content: attr(data-current-tooltip); position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%); background-color: #222; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; pointer-events: none; border: 1px solid #444; z-index: 10; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    body.tax-mode .tab::after { background-color: #441111; border-color: #883333; color: #ffcccc; }
    .tab:hover::after { opacity: 1; visibility: visible; }

    /* Settings Button & Modal */
    #settings-btn { position: absolute; top: 30px; right: 40px; background: none; border: none; color: #666; font-size: 2rem; cursor: pointer; transition: all 0.3s ease; }
    #settings-btn:hover { color: var(--text-color); transform: rotate(45deg); }
    #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #0a0a0a; padding: 35px; border-radius: 16px; border: 1px solid var(--border-color); width: 100%; max-width: 450px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-top: 0; margin-bottom: 20px; font-weight: 500; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; color: #aaa; font-size: 0.9rem; }
    .form-group input, .form-group select { width: 100%; padding: 12px; background: var(--accent-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }
    .calendar-container { margin-bottom: 20px; background: var(--accent-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
    .calendar-header { text-align: center; margin-bottom: 10px; font-weight: bold; color: #ccc; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .day-name { text-align: center; font-size: 0.75rem; color: #666; padding-bottom: 5px; }
    .cal-day { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; background: #222; border-radius: 4px; cursor: pointer; user-select: none; transition: background 0.2s; }
    .cal-day:hover:not(.empty):not(.weekend) { background: #444; }
    .cal-day.empty { background: transparent; cursor: default; }
    .cal-day.weekend { background: var(--weekend-color); color: #884444; cursor: not-allowed; }
    .cal-day.holiday { background: var(--holiday-color); color: white; font-weight: bold; }
    .calendar-legend { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 10px; color: #888; }
    button.save-btn { width: 100%; padding: 14px; background: var(--text-color); color: var(--bg-color); border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button.save-btn:hover { background: #ccc; }
  </style>
</head>
<body>

  <button id="settings-btn" title="Settings">⚙</button>

  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-net" onclick="setTrackingMode('NET')">Net Earned</button>
    <button class="mode-btn" id="mode-tax" onclick="setTrackingMode('TAX')">Tax Paid</button>
  </div>

  <div id="counter">₹0.00</div>
  <div id="status-message">Loading...</div>

  <div class="tabs">
    <button class="tab" id="tab-dtn" data-net-tooltip="Earning in-progress today..." data-tax-tooltip="Paid to government so-far today..." onclick="setTimeView('DTN')">Day (DTN)</button>
    <button class="tab" id="tab-wtn" data-net-tooltip="Accumulating this week's earnings (Sun-Sat)" data-tax-tooltip="Accumulating this week's tax spend (Sun-Sat)" onclick="setTimeView('WTN')">Week (WTN)</button>
    <button class="tab active" id="tab-mtn" data-net-tooltip="Tracking total monthly progress" data-tax-tooltip="Tracking total monthly tax progress" onclick="setTimeView('MTN')">Month (MTN)</button>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div class="modal-content">
      <h2>Configuration</h2>
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Gross Monthly Salary</label>
          <input type="number" id="salary-input" placeholder="e.g. 100000" min="0">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Monthly Tax Paid</label>
          <input type="number" id="tax-input" placeholder="e.g. 15000" min="0">
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Currency</label>
          <select id="currency-input">
            <option value="INR">₹ (INR)</option>
            <option value="USD">$ (USD)</option>
            <option value="EUR">€ (EUR)</option>
            <option value="JPY">¥ (JPY)</option>
            <option value="GBP">£ (GBP)</option>
          </select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Number System</label>
          <select id="format-input">
            <option value="en-IN">Lakhs/Crores</option>
            <option value="en-US">Millions/Billions</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>Start Time</label>
          <input type="time" id="start-time-input" value="10:00">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>End Time</label>
          <input type="time" id="end-time-input" value="18:00">
        </div>
      </div>
      
      <div class="calendar-container">
        <div class="calendar-header" id="cal-month-year"></div>
        <div class="calendar-grid" id="cal-grid"></div>
        <div class="calendar-legend">
          <span>Click weekdays to toggle Holidays</span>
          <span style="color: #ff4444;">■ Holiday</span>
        </div>
      </div>
      <button class="save-btn" id="save-btn">Save & Start</button>
    </div>
  </div>

  <script>
    let intervalId = null;
    let timeView = 'MTN'; 
    let trackingMode = 'NET'; 
    let currentNetQuote = "";
    let currentTaxQuote = "";

    const fallbackNet = ["Tracking your earnings..."];
    const fallbackTax = ["Tracking your tax..."];
    const netArray = (typeof earningQuotes !== 'undefined') ? earningQuotes : fallbackNet;
    const taxArray = (typeof taxQuotes !== 'undefined') ? taxQuotes : fallbackTax;

    let config = {
      salary: parseFloat(localStorage.getItem('sc_salary')) || null,
      tax: parseFloat(localStorage.getItem('sc_tax')) || 0,
      startTime: localStorage.getItem('sc_startTime') || '10:00',
      endTime: localStorage.getItem('sc_endTime') || '18:00',
      currency: localStorage.getItem('sc_currency') || 'INR',
      formatSystem: localStorage.getItem('sc_formatSystem') || 'en-IN',
      holidays: JSON.parse(localStorage.getItem('sc_holidays')) || []
    };

    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status-message');
    const settingsModal = document.getElementById('settings-modal');
    const calGrid = document.getElementById('cal-grid');
    const calMonthYear = document.getElementById('cal-month-year');
    const faviconEl = document.getElementById('favicon');

    // --- Dynamic Favicon Logic ---
    function updateFavicon(currencyCode) {
      const iconMap = {
        'INR': 'rupee.png',
        'USD': 'dollar.png',
        'EUR': 'euro.png',
        'JPY': 'yen.png',
        'GBP': 'pound.png'
      };
      if (iconMap[currencyCode]) {
        faviconEl.href = iconMap[currencyCode];
      }
    }

    function selectRandomQuotes() {
      currentNetQuote = netArray[Math.floor(Math.random() * netArray.length)];
      currentTaxQuote = taxArray[Math.floor(Math.random() * taxArray.length)];
    }

    function updateTooltips() {
      document.querySelectorAll('.tab').forEach(tab => {
        if (trackingMode === 'NET') {
          tab.setAttribute('data-current-tooltip', tab.getAttribute('data-net-tooltip'));
        } else {
          tab.setAttribute('data-current-tooltip', tab.getAttribute('data-tax-tooltip'));
        }
      });
    }

    function init() {
      selectRandomQuotes();
      updateTooltips();
      updateFavicon(config.currency); // Set favicon on load
      
      if (!config.salary) {
        settingsModal.style.display = 'flex';
        renderCalendar();
      } else {
        document.getElementById('salary-input').value = config.salary;
        document.getElementById('tax-input').value = config.tax;
        document.getElementById('start-time-input').value = config.startTime;
        document.getElementById('end-time-input').value = config.endTime;
        document.getElementById('currency-input').value = config.currency;
        document.getElementById('format-input').value = config.formatSystem;
        renderCalendar();
        startCounter();
      }
    }

    function setTimeView(view) {
      timeView = view;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${view.toLowerCase()}`).classList.add('active');
      updateDisplay();
    }

    function setTrackingMode(mode) {
      trackingMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`mode-${mode.toLowerCase()}`).classList.add('active');
      
      if (mode === 'TAX') document.body.classList.add('tax-mode');
      else document.body.classList.remove('tax-mode');
      
      updateTooltips();
      updateDisplay();
    }

    // --- Settings & Calendar Logic ---
    document.getElementById('settings-btn').addEventListener('click', () => {
      renderCalendar();
      settingsModal.style.display = 'flex';
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const newSalary = parseFloat(document.getElementById('salary-input').value);
      const newTax = parseFloat(document.getElementById('tax-input').value) || 0;
      const newStart = document.getElementById('start-time-input').value;
      const newEnd = document.getElementById('end-time-input').value;
      const newCurrency = document.getElementById('currency-input').value;
      
      if (!newSalary || !newStart || !newEnd) { alert("Please fill in required fields."); return; }

      config.salary = newSalary; config.tax = newTax;
      config.startTime = newStart; config.endTime = newEnd;
      config.currency = newCurrency;
      config.formatSystem = document.getElementById('format-input').value;

      localStorage.setItem('sc_salary', config.salary);
      localStorage.setItem('sc_tax', config.tax);
      localStorage.setItem('sc_startTime', config.startTime);
      localStorage.setItem('sc_endTime', config.endTime);
      localStorage.setItem('sc_currency', config.currency);
      localStorage.setItem('sc_formatSystem', config.formatSystem);
      localStorage.setItem('sc_holidays', JSON.stringify(config.holidays));

      updateFavicon(config.currency); // Update favicon instantly after save
      settingsModal.style.display = 'none';
      startCounter();
    });

    function formatDateStr(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
    function toggleHoliday(dateStr) { const index = config.holidays.indexOf(dateStr); if (index > -1) config.holidays.splice(index, 1); else config.holidays.push(dateStr); renderCalendar(); }
    
    function renderCalendar() {
      const now = new Date(); const year = now.getFullYear(); const month = now.getMonth();
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      calMonthYear.innerText = `${monthNames[month]} ${year}`;
      calGrid.innerHTML = '';
      ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach(day => { const div = document.createElement('div'); div.className = 'day-name'; div.innerText = day; calGrid.appendChild(div); });
      const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) { const div = document.createElement('div'); div.className = 'cal-day empty'; calGrid.appendChild(div); }
      for (let i = 1; i <= daysInMonth; i++) {
        const date = new Date(year, month, i); const dateStr = formatDateStr(date);
        const isWeekend = date.getDay() === 0 || date.getDay() === 6;
        const isHoliday = config.holidays.includes(dateStr);
        const div = document.createElement('div'); div.className = 'cal-day'; div.innerText = i;
        if (isWeekend) div.classList.add('weekend');
        else { if (isHoliday) div.classList.add('holiday'); div.onclick = () => toggleHoliday(dateStr); }
        calGrid.appendChild(div);
      }
    }

    // --- Math Engine ---
    function isWorkingDay(date) {
      if (date.getDay() === 0 || date.getDay() === 6) return false;
      return !config.holidays.includes(formatDateStr(date));
    }

    function getWorkingDaysInMonth(year, month) {
      let count = 0; const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 1; i <= daysInMonth; i++) if (isWorkingDay(new Date(year, month, i))) count++;
      return count || 1;
    }

    function parseTimeForDate(timeStr, baseDate) {
      const [hours, minutes] = timeStr.split(':').map(Number);
      const d = new Date(baseDate); d.setHours(hours, minutes, 0, 0); return d;
    }

    function formatMoney(amount, isTaxMode) {
      const formatted = new Intl.NumberFormat(config.formatSystem, { style: 'currency', currency: config.currency, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
      return isTaxMode ? `-${formatted}` : formatted;
    }

    function getAmountForSingleDay(targetDate, now, dailyAmount, amountPerMs) {
      if (!isWorkingDay(targetDate)) return 0;
      if (targetDate.toDateString() !== now.toDateString() && targetDate < now) return dailyAmount; 
      if (targetDate.toDateString() === now.toDateString()) {
        const start = parseTimeForDate(config.startTime, now); const end = parseTimeForDate(config.endTime, now);
        if (now < start) return 0; if (now > end) return dailyAmount;
        return (now - start) * amountPerMs;
      }
      return 0;
    }

    function updateDisplay() {
      const now = new Date(); const currentYear = now.getFullYear(); const currentMonth = now.getMonth();
      const workingDaysThisMonth = getWorkingDaysInMonth(currentYear, currentMonth);
      let targetMonthlyAmount = trackingMode === 'TAX' ? config.tax : (config.salary - config.tax);
      const dailyAmount = targetMonthlyAmount / workingDaysThisMonth;
      
      const startToday = parseTimeForDate(config.startTime, now);
      const endToday = parseTimeForDate(config.endTime, now);
      const amountPerMs = dailyAmount / (endToday - startToday);

      let totalAccumulated = 0;

      if (timeView === 'DTN') {
        totalAccumulated = getAmountForSingleDay(now, now, dailyAmount, amountPerMs);
      } else if (timeView === 'WTN') {
        const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay());
        for (let d = new Date(startOfWeek); d <= now; d.setDate(d.getDate() + 1)) totalAccumulated += getAmountForSingleDay(d, now, dailyAmount, amountPerMs);
      } else if (timeView === 'MTN') {
        const startOfMonth = new Date(currentYear, currentMonth, 1);
        for (let d = new Date(startOfMonth); d <= now; d.setDate(d.getDate() + 1)) totalAccumulated += getAmountForSingleDay(d, now, dailyAmount, amountPerMs);
      }

      counterEl.innerText = formatMoney(totalAccumulated, trackingMode === 'TAX');
      
      if (!isWorkingDay(now)) {
        statusEl.innerText = "Holiday/Weekend (Zero movement today)";
      } else if (now < startToday || now > endToday) {
        statusEl.innerText = trackingMode === 'TAX' ? "Tax extraction paused (off-hours)." : "Earning paused (off-hours).";
      } else {
        statusEl.innerText = trackingMode === 'TAX' ? currentTaxQuote : currentNetQuote;
      }
    }

    function startCounter() {
      if (intervalId) clearInterval(intervalId);
      updateDisplay(); 
      intervalId = setInterval(updateDisplay, 1000); 
    }

    init();
  </script>
</body>
</html>
